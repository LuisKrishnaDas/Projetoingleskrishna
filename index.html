'Verbo to be':{intro:'To be pode significar ser ou estar. Ele muda conforme o sujeito e também funciona como verbo principal em frases sobre identidade, estado, profissão e localização.',form:'I am · he/she/it is · you/we/they are',examples:[['I am tired.','Estou cansado(a).'],['He is a teacher.','Ele é professor.'],['We are at home.','Estamos em casa.']],tip:'Contrações comuns: I’m, you’re, he’s, she’s, it’s, we’re, they’re.',mistake:'Não use “I is” nem “they is”. Combine o verbo com o sujeito.',q:'Complete: “My parents ___ at work.”',opts:['am','is','are','be'],a:2,why:'My parents equivale a they; por isso usamos are.'},
'Frases afirmativas':{intro:'A frase afirmativa em inglês costuma seguir uma ordem mais fixa do que em português. O sujeito aparece antes do verbo e o complemento vem depois.',form:'Sujeito + verbo + complemento',examples:[['I drink coffee every morning.','Eu tomo café todas as manhãs.'],['My brother plays soccer.','Meu irmão joga futebol.'],['They live in Brazil.','Eles moram no Brasil.']],tip:'Em inglês, não é comum retirar o sujeito. Mesmo com verbos sobre clima, use it: “It rains a lot”.',mistake:'Evite traduzir palavra por palavra e colocar o verbo antes do sujeito em frases afirmativas.',q:'Qual frase tem a ordem correta?',opts:['Likes she music.','She likes music.','Music she likes.','She music likes.'],a:1,why:'A ordem neutra é sujeito (She) + verbo (likes) + complemento (music).'},
'Artigos a e an':{intro:'A e an significam um/uma e são usados antes de substantivos contáveis no singular quando falamos de algo não específico. A escolha depende do som inicial da palavra seguinte.',form:'a + som de consoante · an + som de vogal',examples:[['a book','um livro'],['an orange','uma laranja'],['an hour','uma hora']],tip:'Observe o som, não apenas a letra: hour começa com som de vogal; university começa com som de “yu”, parecido com consoante.',mistake:'Não use a/an com substantivos no plural ou incontáveis em sentido geral: “a water” normalmente não.',q:'Escolha a opção correta: “___ umbrella”.',opts:['A','An','The','No article'],a:1,why:'Umbrella começa com som de vogal; usamos an.'},
'Plural dos substantivos':{intro:'A maioria dos substantivos contáveis forma o plural com -s. A terminação muda em alguns grupos de palavras.',form:'regra geral: +s · -s/-sh/-ch/-x/-z: +es · consoante + y: y → ies',examples:[['one book → two books','um livro → dois livros'],['one box → three boxes','uma caixa → três caixas'],['one city → two cities','uma cidade → duas cidades']],tip:'Há plurais irregulares que precisam ser aprendidos: man/men, child/children, person/people.',mistake:'Não escreva “two book” quando estiver falando de duas unidades.',q:'Qual é o plural de “baby”?',opts:['Babys','Babyes','Babies','Babyies'],a:2,why:'Consoante + y muda para -ies: baby → babies.'},
'Presente simples':{intro:'O simple present descreve hábitos, rotinas, fatos e situações relativamente permanentes. A forma do verbo só muda na terceira pessoa do singular.',form:'I/you/we/they + verbo base · he/she/it + verbo-s/-es',examples:[['I work from home.','Eu trabalho de casa.'],['She studies English.','Ela estuda inglês.'],['The sun rises in the east.','O sol nasce no leste.']],tip:'Com he/she/it, normalmente acrescente -s; verbos terminados em -ch, -sh, -ss, -x ou -o geralmente recebem -es. Study vira studies.',mistake:'Não acrescente -s com I, you, we ou they: “They works” está incorreto.',q:'Complete: “Lucas ___ English every night.”',opts:['study','studies','studying','studied'],a:1,why:'Lucas = he; no presente simples, study vira studies.'},
'Negativa com do e does':{intro:'Para negar no presente simples, usamos do not ou does not antes do verbo principal. O auxiliar carrega a marca da terceira pessoa; o verbo principal fica na forma base.',form:'I/you/we/they + don’t + verbo · he/she/it + doesn’t + verbo',examples:[['I don’t eat meat.','Eu não como carne.'],['She doesn’t drive.','Ela não dirige.'],['They don’t live here.','Eles não moram aqui.']],tip:'Don’t = do not. Doesn’t = does not. As formas completas são mais comuns em situações enfáticas ou formais.',mistake:'Depois de doesn’t, não use verbo com -s: “She doesn’t likes” está errado. Use “She doesn’t like”.',q:'Complete: “He doesn’t ___ coffee.”',opts:['drinks','drinking','drink','drank'],a:2,why:'Depois de doesn’t, o verbo principal fica na forma base: drink.'},
'Perguntas com do e does':{intro:'No presente simples, perguntas sobre ações e hábitos começam com do ou does. O auxiliar vem antes do sujeito.',form:'Do/Does + sujeito + verbo base + complemento?',examples:[['Do you speak English?','Você fala inglês?'],['Does she work here?','Ela trabalha aqui?'],['Where do they live?','Onde eles moram?']],tip:'Use does com he, she e it. Com palavras interrogativas, coloque what/where/when/how antes do auxiliar.',mistake:'Não coloque -s no verbo depois de does: “Does he plays?” está errado.',q:'Qual pergunta está correta?',opts:['Does she likes tea?','Do she like tea?','Does she like tea?','She does like tea?'],a:2,why:'Does + she + verbo base: Does she like tea?'},
'Adjetivos':{intro:'Adjetivos descrevem pessoas, objetos, lugares e situações. Em inglês, geralmente aparecem antes do substantivo e não recebem plural.',form:'adjetivo + substantivo · sujeito + be + adjetivo',examples:[['a small house','uma casa pequena'],['The houses are small.','As casas são pequenas.'],['This coffee is hot.','Este café está quente.']],tip:'Dois adjetivos podem aparecer antes do substantivo: a beautiful old house.',mistake:'Não coloque o adjetivo no plural: “smalls houses” está incorreto.',q:'Complete: “They live in a ___ house.”',opts:['beautiful','beautifully','beauty','beautifulls'],a:0,why:'Beautiful é o adjetivo que descreve house.'},
'There is e there are':{intro:'There is e there are significam há/existe/existem e apresentam a existência ou presença de algo em determinado lugar.',form:'There is + singular/incontável · There are + plural',examples:[['There is a park near here.','Há um parque perto daqui.'],['There are two windows.','Há duas janelas.'],['Is there any milk?','Há leite?']],tip:'A negativa é there isn’t / there aren’t. Em perguntas, inverta: Is there…? / Are there…?',mistake:'Não use there is com substantivos claramente plurais: “There is two cars” está errado.',q:'Complete: “There ___ three students in the room.”',opts:['is','am','are','be'],a:2,why:'Three students está no plural; usamos there are.'},
'Preposições de lugar':{intro:'Preposições de lugar mostram onde algo ou alguém está. A escolha depende da relação espacial descrita.',form:'in = dentro · on = sobre/em contato com superfície · under = embaixo · next to = ao lado',examples:[['The keys are on the table.','As chaves estão sobre a mesa.'],['The cat is under the bed.','O gato está embaixo da cama.'],['She is in the kitchen.','Ela está na cozinha.']],tip:'At também indica um ponto ou local específico: at the bus stop, at school, at home.',mistake:'Não traduza todas as preposições literalmente: expressões fixas podem variar entre inglês e português.',q:'A imagem mental é: o livro está dentro da mochila. Qual frase?',opts:['The book is on the bag.','The book is in the bag.','The book is under the bag.','The book is next the bag.'],a:1,why:'In indica que algo está dentro de outro espaço.'},
'Can para habilidade e pedidos':{intro:'Can é um verbo modal usado para falar de habilidade, possibilidade e pedidos. Ele não muda com he/she/it e é seguido pelo verbo na forma base.',form:'sujeito + can + verbo base · Can + sujeito + verbo…?',examples:[['I can swim.','Eu sei nadar.'],['She can drive.','Ela sabe dirigir.'],['Can you help me?','Você pode me ajudar?']],tip:'A negativa é cannot ou can’t. Para pedidos mais gentis, também podemos usar could.',mistake:'Não use “to” nem -s depois de can: “She can to swim” está incorreto.',q:'Complete: “My sister can ___ very well.”',opts:['sings','to sing','sing','singing'],a:2,why:'Depois de can usamos o verbo base: sing.'},
'Presente contínuo':{intro:'O present continuous descreve ações acontecendo agora ou situações temporárias. Ele combina o verbo to be com o verbo principal terminado em -ing.',form:'am/is/are + verbo-ing',examples:[['I am studying now.','Estou estudando agora.'],['They are having lunch.','Eles estão almoçando.'],['He isn’t sleeping.','Ele não está dormindo.']],tip:'Retire o -e final em make → making. Em alguns verbos curtos, dobre a consoante: run → running.',mistake:'Não esqueça o verbo to be: “She working” está incompleto; diga “She is working”.',q:'Complete: “We ___ watching a movie.”',opts:['is','am','are','be'],a:2,why:'We combina com are: We are watching.'},
'Passado com was e were':{intro:'Was e were são as formas do passado do verbo to be. Use para falar de estados, características e localização no passado.',form:'I/he/she/it + was · you/we/they + were',examples:[['I was tired yesterday.','Eu estava cansado(a) ontem.'],['They were at school.','Eles estavam na escola.'],['Was she happy?','Ela estava feliz?']],tip:'A negativa é wasn’t / weren’t. Em perguntas, was/were vem antes do sujeito.',mistake:'Não use was com they/we/you: “They was” está incorreto.',q:'Complete: “You ___ right.”',opts:['was','were','are','is'],a:1,why:'You sempre combina com were no passado do to be.'},
'Passado simples regular':{intro:'O simple past fala de ações concluídas no passado. Muitos verbos formam o passado com -ed e usam a mesma forma para todas as pessoas.',form:'sujeito + verbo-ed · negativa: didn’t + verbo base',examples:[['We watched a film.','Nós assistimos a um filme.'],['She visited her aunt.','Ela visitou a tia.'],['I didn’t work yesterday.','Eu não trabalhei ontem.']],tip:'Se o verbo termina em e, acrescente apenas -d (live → lived). Consoante + y geralmente vira -ied (study → studied).',mistake:'Depois de didn’t, volte à forma base: “didn’t watched” está errado.',q:'Complete: “They ___ soccer last Sunday.”',opts:['play','plays','played','playing'],a:2,why:'Last Sunday indica passado; play é regular: played.'},
'Passado simples irregular':{intro:'Alguns verbos muito comuns não formam o passado com -ed. Eles mudam para uma forma própria, que precisa ser aprendida e praticada.',form:'go → went · have → had · see → saw · eat → ate',examples:[['I went home early.','Fui para casa cedo.'],['She had a meeting.','Ela teve uma reunião.'],['We saw that movie.','Nós vimos aquele filme.']],tip:'Na negativa e na pergunta, use did/didn’t + forma base: Did you go? / I didn’t go.',mistake:'Não combine did com o verbo no passado: “Did you went?” está errado.',q:'Qual é o passado de “go”?',opts:['goed','gone','went','going'],a:2,why:'Go é irregular: seu passado simples é went.'},
'Futuro com going to':{intro:'Be going to é usado principalmente para planos e intenções já considerados, além de previsões baseadas em evidências presentes.',form:'am/is/are + going to + verbo base',examples:[['I am going to study tonight.','Vou estudar hoje à noite.'],['Look at the clouds. It is going to rain.','Olhe as nuvens. Vai chover.'],['They are going to travel.','Eles vão viajar.']],tip:'A forma negativa coloca not depois de am/is/are: She isn’t going to come.',mistake:'Não esqueça o verbo to be: “I going to travel” está incompleto.',q:'Complete: “She ___ going to call you.”',opts:['am','are','is','be'],a:2,why:'She combina com is: She is going to call you.'},
'Futuro com will':{intro:'Will é usado para decisões tomadas no momento da fala, promessas, ofertas e previsões ou opiniões sobre o futuro.',form:'sujeito + will + verbo base',examples:[['I will help you.','Eu vou ajudar você.'],['I think it will rain.','Acho que vai chover.'],['We won’t forget.','Nós não vamos esquecer.']],tip:'Will não muda conforme o sujeito. A forma negativa é will not ou won’t.',mistake:'Não acrescente to ou -s depois de will: “He will goes” está errado.',q:'Complete: “They will ___ tomorrow.”',opts:['arrives','arrive','to arrive','arriving'],a:1,why:'Depois de will usamos o verbo na forma base: arrive.'},
'Some e any':{intro:'Some e any indicam uma quantidade não especificada. Some aparece frequentemente em afirmações; any é comum em perguntas e negativas.',form:'some: afirmações/ofertas · any: perguntas/negativas',examples:[['I have some friends here.','Tenho alguns amigos aqui.'],['Do you have any questions?','Você tem alguma pergunta?'],['We don’t have any milk.','Não temos leite.']],tip:'Some também aparece em ofertas e pedidos quando esperamos uma resposta positiva: Would you like some tea?',mistake:'Não trate a regra como absoluta: o contexto e a intenção podem mudar a escolha.',q:'Complete: “I don’t have ___ money.”',opts:['some','any','many','a'],a:1,why:'Em negativas, any é a escolha mais comum para quantidade não especificada.'},
'Much e many':{intro:'Much e many significam muito/muitos. A escolha depende de o substantivo ser contável ou incontável.',form:'many + contáveis no plural · much + incontáveis',examples:[['How many books do you have?','Quantos livros você tem?'],['How much water do we need?','De quanta água precisamos?'],['There aren’t many chairs.','Não há muitas cadeiras.']],tip:'A lot of pode ser usado com contáveis e incontáveis: a lot of books / a lot of time.',mistake:'Money, water, information e advice são incontáveis em inglês; não use many com eles.',q:'Complete: “How ___ time do we have?”',opts:['many','much','few','several'],a:1,why:'Time é incontável; usamos how much.'},
'Comparativos':{intro:'Comparativos comparam duas pessoas, objetos ou situações. Adjetivos curtos geralmente recebem -er; adjetivos mais longos geralmente usam more.',form:'adjetivo curto + -er + than · more + adjetivo + than',examples:[['My car is faster than yours.','Meu carro é mais rápido que o seu.'],['This book is more interesting than that one.','Este livro é mais interessante que aquele.'],['Today is hotter than yesterday.','Hoje está mais quente que ontem.']],tip:'Algumas formas são irregulares: good → better; bad → worse; far → farther/further.',mistake:'Não use “more faster”. Escolha uma estrutura: faster ou more expensive.',q:'Complete: “This test is ___ than the last one.”',opts:['easy','easier','more easyer','easiest'],a:1,why:'Easy termina em consoante + y: troca y por i e recebe -er → easier.'},
'Superlativos':{intro:'O superlativo destaca um elemento dentro de um grupo. Em geral, adjetivos curtos recebem -est e adjetivos longos usam the most.',form:'the + adjetivo-est · the most + adjetivo',examples:[['She is the tallest in the class.','Ela é a mais alta da turma.'],['This is the most expensive option.','Esta é a opção mais cara.'],['It was the best day.','Foi o melhor dia.']],tip:'Formas irregulares importantes: good → the best; bad → the worst.',mistake:'Não misture “most” e “-est”: “the most tallest” está incorreto.',q:'Complete: “Mount Everest is the ___ mountain in the world.”',opts:['higher','highest','most high','more high'],a:1,why:'High é curto; o superlativo é the highest.'},
'Pronomes possessivos':{intro:'Adjetivos possessivos acompanham um substantivo. Pronomes possessivos substituem o substantivo para evitar repetição.',form:'my/your/his/her/its/our/their + substantivo · mine/yours/his/hers/ours/theirs sem substantivo',examples:[['This is my bag.','Esta é minha bolsa.'],['This bag is mine.','Esta bolsa é minha.'],['Their house is big.','A casa deles é grande.']],tip:'His pode ser adjetivo ou pronome possessivo. Its indica posse de algo/animal; it’s significa it is.',mistake:'Não escreva “This is mine book”. Use “my book” ou “This book is mine”.',q:'Complete: “That phone belongs to me. It is ___.”',opts:['my','mine','I','me'],a:1,why:'Mine substitui “my phone”; não vem seguido de substantivo.'},
'Imperativos':{intro:'O imperativo é usado para instruções, orientações, convites e comandos. A frase começa com o verbo na forma base e normalmente não mostra o sujeito.',form:'verbo base + complemento · negativa: don’t + verbo base',examples:[['Please sit down.','Por favor, sente-se.'],['Turn left at the corner.','Vire à esquerda na esquina.'],['Don’t touch that.','Não toque nisso.']],tip:'Please torna a instrução mais educada. Let’s + verbo sugere fazer algo juntos: Let’s go.',mistake:'Não coloque “to” antes do verbo no imperativo: “To open the door” não é uma instrução completa.',q:'Qual é a forma negativa de “Open the window”?',opts:['No open the window.','Don’t open the window.','Doesn’t open the window.','Not open the window.'],a:1,why:'A negativa do imperativo é don’t + verbo base.'},
'Would like':{intro:'Would like expressa desejo ou preferência de maneira educada. É mais gentil e menos direto do que want em muitos contextos.',form:'would like + substantivo · would like + to + verbo',examples:[['I would like a coffee.','Eu gostaria de um café.'],['She would like to travel.','Ela gostaria de viajar.'],['Would you like some tea?','Você gostaria de um chá?']],tip:'A contração é ’d like: I’d like, he’d like, we’d like.',mistake:'Quando vier um verbo depois de would like, use to: “I would like go” está errado.',q:'Complete: “I would like ___ learn English.”',opts:['for','to','at','of'],a:1,why:'A estrutura é would like + to + verbo.'},
'Conectivo and':{intro:'And conecta palavras, grupos de palavras ou orações que acrescentam uma informação. Equivale a e.',form:'ideia + and + ideia',examples:[['I like tea and coffee.','Gosto de chá e café.'],['She opened the door and smiled.','Ela abriu a porta e sorriu.'],['We study English and Spanish.','Estudamos inglês e espanhol.']],tip:'Use vírgulas em listas de três ou mais itens conforme o estilo: apples, oranges, and bananas.',mistake:'Não use and para indicar contraste; nesse caso, but é mais adequado.',q:'Qual conectivo completa: “I bought bread ___ milk”?',opts:['but','because','and','or'],a:2,why:'And acrescenta um segundo item à lista.'},
'Conectivo but':{intro:'But conecta ideias que contrastam ou apresentam uma diferença. Equivale a mas/porém.',form:'ideia A + but + ideia contrastante',examples:[['I am tired, but I am happy.','Estou cansado, mas estou feliz.'],['It is small, but comfortable.','É pequeno, mas confortável.'],['She studied, but the test was difficult.','Ela estudou, mas a prova foi difícil.']],tip:'But geralmente conecta duas ideias dentro da mesma frase. However também expressa contraste, mas tem posicionamento e pontuação diferentes.',mistake:'Não confunda but (contraste) com and (adição).',q:'Complete: “I like the job, ___ the salary is low.”',opts:['and','but','because','so'],a:1,why:'A segunda ideia contrasta com a primeira; use but.'},
'Conectivo because':{intro:'Because introduz a causa ou razão de uma ação ou situação. Equivale a porque.',form:'resultado + because + motivo',examples:[['I stayed home because it rained.','Fiquei em casa porque choveu.'],['She is happy because she passed.','Ela está feliz porque passou.'],['Because I was tired, I went to bed.','Como eu estava cansado, fui dormir.']],tip:'A oração com because pode vir antes ou depois. Quando vem primeiro, normalmente separamos as orações com vírgula.',mistake:'Because apresenta a razão; so apresenta a consequência. Evite usar os dois juntos na mesma estrutura básica.',q:'Complete: “He went to bed early ___ he was tired.”',opts:['but','and','because','or'],a:2,why:'A segunda oração explica a razão de ele ter ido dormir cedo.'},
'Advérbios de frequência':{intro:'Advérbios de frequência indicam com que regularidade algo acontece. Eles ajudam a descrever hábitos e rotinas.',form:'antes do verbo principal · depois do verbo to be',examples:[['I usually walk to work.','Geralmente vou a pé para o trabalho.'],['She is always kind.','Ela é sempre gentil.'],['They never arrive late.','Eles nunca chegam atrasados.']],tip:'Ordem aproximada do mais frequente ao menos frequente: always, usually, often, sometimes, hardly ever, never.',mistake:'Com to be, não coloque o advérbio antes do verbo: “She always is happy” é menos natural que “She is always happy”.',q:'Qual frase está na ordem mais natural?',opts:['I go usually by bus.','I usually go by bus.','Usually I by bus go.','I go by usually bus.'],a:1,why:'Usually normalmente vem antes do verbo principal go.'},
'Preposições de tempo':{intro:'At, on e in localizam acontecimentos no tempo. A escolha depende do nível de precisão: horário, dia/data ou período mais amplo.',form:'at + horário · on + dia/data · in + mês/ano/estação/período',examples:[['at 7 o’clock','às sete horas'],['on Monday','na segunda-feira'],['in July / in 2026 / in the morning','em julho / em 2026 / de manhã']],tip:'Há expressões fixas: at night, at the weekend (mais comum no inglês britânico), on the weekend (mais comum no americano).',mistake:'Não use in antes de um horário específico: “in 8 o’clock” está incorreto.',q:'Complete: “My birthday is ___ October.”',opts:['at','on','in','by'],a:2,why:'October é um mês; usamos in.'}
};
const curriculumTitles=['Pessoas e relações','Casa e objetos','Comida e refeições','Compras e dinheiro','Cidade e transporte','Trabalho e profissões','Estudos e escola','Corpo e saúde','Roupas e cores','Clima e natureza','Animais','Viagens e hospedagem','Restaurante','Tecnologia','Tempo e calendário','Esportes e lazer','Sentimentos','Rotina doméstica','Direções','Comunicação','Família','Mercado','Serviços','Emergências','Planos','Experiências','Opiniões','Descrição de pessoas','Descrição de lugares','Conversas do cotidiano','Pronomes em contexto','Verbo to be na prática','Artigos e objetos','Plural e quantidades','Hábitos','Perguntas cotidianas','Negativas','Adjetivos úteis','Localização','Habilidades','Ações agora','Ontem e passado','Histórias simples','Planos futuros','Pedidos educados','Comida: quantidades','Comparações','Posse e pertencimento','Instruções','Conectando ideias','Frequência','Tempo e horários','No aeroporto','No hotel','No consultório','No banco','No trabalho','Na universidade','Vida social','Revisão essencial'];
const allExisting=SEED.filter(c=>c&&typeof c.en==='string'&&typeof c.pt==='string');
const used=new Set(lessonUnits.flatMap(u=>u.words.map(w=>String(w[0]).toLowerCase())));
const extra=allExisting.filter(c=>!used.has(c.en.toLowerCase()));
const UNIT_SYMBOLS=['pothi','kalasha','kamandalu','chhatra','sri-yantra','vajra','bodhi-leaf','chintamani','golden-fish','hamsa','ba-bird','sudarshana','ghanta','khanda','ouroboros','shen-ring','djed','tyet','veena','sistrum','triratna','ahimsa-hand','uraeus','damaru','feather-of-maat','bennu','trishula','khepri','mala','tilak','stupa','endless-knot','shankha','dharmachakra','eye-of-horus','ankh','was-scepter','om'];
for(let i=0;i<curriculumTitles.length;i++){
 const chunk=extra.slice(i*4,(i+1)*4); if(chunk.length<4) break;
 const g=grammarNotes[i%grammarNotes.length];
 lessonUnits.push({id:`path-${String(i+1).padStart(2,'0')}`,title:curriculumTitles[i],theme:`Vocabulário em contexto · ${g[0]}`,icon:ornament(UNIT_SYMBOLS[i%UNIT_SYMBOLS.length]),color:['sun','mint','gold','pink'][i%4],grammarTitle:g[0],grammar:g[1],pattern:g[2],words:chunk.map(c=>[c.en,c.pt,c.ex||`${c.en} — ${c.pt}`])});
}
lessonUnits.forEach((u,i)=>{if(!u.grammar){const g=grammarNotes[i%grammarNotes.length];u.grammarTitle=g[0];u.grammar=g[1];u.pattern=g[2]}});
let lessonRun=null;
function lessonCard(pair){let c=S.cards.find(x=>normAnswer(x.en)===normAnswer(pair[0]));if(!c){c=makeCard(pair[0],pair[1]);c.ex=pair[2];c.category='Aulas temáticas';S.cards.push(c);save()}else if(!c.ex){c.ex=pair[2]}return c}
function unitDone(id){return !!S.unitProgress?.[id]?.done}
function lessonHomePanel(){const done=lessonUnits.filter(u=>unitDone(u.id)).length,next=lessonUnits.find(u=>!unitDone(u.id));return `<div class="section-head"><h2>Aulas curtinhas</h2><span class="pill">${done}/${lessonUnits.length} unidades · ${lessonUnits.length*4} microaulas</span></div><div class="card"><p class="muted">Uma trilha longa, em passos pequenos: vocabulário, gramática explicada, construção de frases e revisões. A dificuldade cresce aos poucos.</p><div class="progress"><i style="width:${done/lessonUnits.length*100}%"></i></div><div style="margin-top:14px"><b>${next?`Próxima aula: ${next.title}`:'Você concluiu todas as unidades iniciais! 🎉'}</b></div><button class="btn" style="margin-top:12px" onclick="go('lessons')">${next?'Abrir minhas aulas':'Revisar minhas aulas'} →</button></div>`}
function lessonsPage(){const done=lessonUnits.filter(u=>unitDone(u.id)).length;return head('APRENDA PASSO A PASSO','Suas aulas de inglês','Primeiro entenda. Depois pratique. Sem pressa.')+`<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px"><b>Sua jornada</b><span class="pill">${done} de ${lessonUnits.length} unidades concluídas · ${lessonUnits.length*4} microaulas</span></div><div class="progress" style="margin:12px 0"><i style="width:${done/lessonUnits.length*100}%"></i></div><p class="muted" style="margin:0">As unidades são liberadas em sequência para construir uma base aos poucos.</p></div><div class="lesson-grid">${lessonUnits.map((u,i)=>{const complete=unitDone(u.id),locked=i>0&&!unitDone(lessonUnits[i-1].id);return `<button class="card lesson-unit ${locked?'locked':''}" ${locked?'disabled':''} onclick="beginLesson('${u.id}')"><span class="unit-icon">${complete?'✅':locked?'🔒':u.icon}</span><h3>${i+1}. ${u.title}</h3><p>${u.theme}</p><div class="lesson-meter"><i style="width:${complete?100:0}%"></i></div><small class="muted">${complete?'Concluída':locked?'Conclua a unidade anterior':'4 microaulas · gramática · frase · revisão'}</small></button>`}).join('')}</div>`}
function beginLesson(id){const u=lessonUnits.find(x=>x.id===id);if(!u)return;const idx=lessonUnits.indexOf(u);if(idx>0&&!unitDone(lessonUnits[idx-1].id)){toast('Faça a unidade anterior primeiro.');return}const cards=u.words.map(lessonCard);lessonRun={id,phase:'learn',index:0,quizIndex:0,reviewIndex:0,correct:0,answers:0,cards,review:shuffle(cards).slice(0,Math.min(3,cards.length))};page='lessons';renderLesson()}
function renderLesson(){if(!lessonRun)return;const r=lessonRun,u=lessonUnits.find(x=>x.id===r.id);let body='';if(r.phase==='learn'){const c=r.cards[r.index];body=`<div class="lesson-progress-top"><button class="btn secondary small" onclick="lessonRun=null;render()">← Sair</button><div class="progress"><i style="width:${(r.index/r.cards.length)*100}%"></i></div><b>${r.index+1}/${r.cards.length}</b></div><div class="card lesson-word"><div class="study-kicker">APRENDA · ${u.title}</div><div class="word-big">${esc(c.en)}</div><h2 style="margin:0">${esc(c.pt)}</h2><div class="lesson-example"><small class="eyebrow">EM UMA FRASE</small><p style="font-size:17px;margin:7px 0">${esc(c.ex||u.words[r.index][2])}</p><button class="btn soft small" onclick="speak(${esc(JSON.stringify(c.en))})">🔊 Ouvir palavra</button>${(c.ex||u.words[r.index][2])?`<button class="btn soft small" style="margin-left:6px" onclick="speak(${esc(JSON.stringify(c.ex||u.words[r.index][2]))})">🔊 Ouvir frase</button>`:''}</div><p class="muted">Leia em voz alta, observe o significado e veja como a palavra aparece em uma frase.</p><button class="btn" onclick="lessonNextLearn()">${r.index===r.cards.length-1?'Ir para os exercícios':'Aprendi, próxima palavra →'}</button></div>`}
else if(r.phase==='grammar'){const g=grammarDetails[u.grammarTitle]||{intro:u.grammar,form:u.pattern,examples:[[u.pattern,'Exemplo da estrutura']],tip:'Observe a estrutura e tente criar uma frase própria.',mistake:'Confira a posição do sujeito e do verbo.',q:'Qual opção corresponde à regra apresentada?',opts:[u.pattern,'Não sei ainda','Nenhuma das opções','Todas as opções'],a:0,why:'Esta é a estrutura-modelo desta aula.'};body=`<div class="lesson-progress-top"><button class="btn secondary small" onclick="lessonRun=null;render()">← Sair</button><div class="progress"><i style="width:55%"></i></div><b>Entenda</b></div><div class="card lesson-word"><div class="study-kicker">GRAMÁTICA · EXPLICAÇÃO GUIADA</div><h2>${esc(u.grammarTitle||'Uma regra para usar agora')}</h2><p style="text-align:left;line-height:1.75">${esc(g.intro)}</p><div class="lesson-example"><small class="eyebrow">COMO FORMAR</small><p style="font-size:16px">${esc(g.form)}</p></div><h3 style="text-align:left;margin-top:18px">Exemplos comentados</h3><div style="display:grid;gap:9px">${g.examples.map((e,i)=>`<div class="lesson-example"><b>${esc(e[0])}</b><p class="muted" style="margin:5px 0 0">${esc(e[1])}</p><button class="btn soft small" onclick="speak(${esc(JSON.stringify(e[0]))})">🔊 Ouvir</button></div>`).join('')}</div><div class="feedback" style="margin-top:14px"><b>Dica</b><p>${esc(g.tip)}</p></div><div class="feedback bad"><b>Erro comum para evitar</b><p>${esc(g.mistake)}</p></div><button class="btn" onclick="lessonStartGrammarQuiz()">Praticar esta regra →</button></div>`}
else if(r.phase==='grammarQuiz'){const g=grammarDetails[u.grammarTitle];body=`<div class="lesson-progress-top"><button class="btn secondary small" onclick="lessonRun.phase='grammar';renderLesson()">← Explicação</button><div class="progress"><i style="width:68%"></i></div><b>Prática de gramática</b></div><div class="card study-card"><div class="study-kicker">APLIQUE A REGRA</div><h2 class="study-question">${esc(g.q)}</h2><p class="study-hint">Escolha a alternativa correta.</p><div class="options">${g.opts.map((o,i)=>`<button class="option" onclick="lessonGrammarAnswer(${i})">${esc(o)}</button>`).join('')}</div><div id="grammar-feedback"></div></div>`}
else if(r.phase==='quiz'){const c=r.cards[r.quizIndex],opts=shuffle([c.pt,...shuffle(r.cards.filter(x=>x.id!==c.id).map(x=>x.pt)).slice(0,3)]);r.options=opts;body=`<div class="lesson-progress-top"><button class="btn secondary small" onclick="lessonRun=null;render()">← Sair</button><div class="progress"><i style="width:${(r.quizIndex/r.cards.length)*100}%"></i></div><b>${r.quizIndex+1}/${r.cards.length}</b></div><div class="card study-card"><div class="study-kicker">AGORA É SUA VEZ · EXERCÍCIO</div><div class="study-question">${esc(c.en)}</div><p class="study-hint">Qual é o significado em português?</p><div class="options">${opts.map((o,i)=>`<button class="option" onclick="lessonAnswer(${i})">${esc(o)}</button>`).join('')}</div><div id="lesson-feedback"></div></div>`}
else if(r.phase==='build'){body=`<div class="lesson-progress-top"><button class="btn secondary small" onclick="lessonRun=null;render()">← Sair</button><div class="progress"><i style="width:82%"></i></div><b>Monte a frase</b></div><div class="card study-card"><div class="study-kicker">CONSTRUÇÃO DE FRASES</div><h2 class="study-question">${esc(u.pattern)}</h2><p class="study-hint">Digite a frase em inglês como aparece no exemplo da regra.</p><input id="lesson-build-answer" class="text-input" placeholder="Escreva sua frase em inglês" autocomplete="off"><div id="lesson-build-feedback"></div><button class="btn" onclick="checkBuild()">Conferir frase</button></div>`}
else {const c=r.review[r.reviewIndex];body=`<div class="lesson-progress-top"><button class="btn secondary small" onclick="lessonRun=null;render()">← Sair</button><div class="progress"><i style="width:${r.reviewIndex/r.review.length*100}%"></i></div><b>${r.reviewIndex+1}/${r.review.length}</b></div><div class="card study-card"><div class="study-kicker">REVISÃO FINAL · FIXANDO O APRENDIZADO</div><div class="study-question">${esc(c.pt)}</div><p class="study-hint">Lembre-se da expressão em inglês. Depois revele a resposta.</p><div id="review-answer" class="hidden feedback"><b>${esc(c.en)}</b><p>${esc(c.ex||'')}</p><button class="btn soft small" onclick="speak(${esc(JSON.stringify(c.en))})">🔊 Ouvir palavra</button>${c.ex?`<button class="btn soft small" style="margin-left:6px" onclick="speak(${esc(JSON.stringify(c.ex))})">🔊 Ouvir frase</button>`:''}</div><div class="study-actions"><button class="btn" onclick="revealReview()">Revelar resposta</button><button id="review-next" class="btn secondary" disabled onclick="reviewNext()">${r.reviewIndex===r.review.length-1?'Concluir revisão':'Próxima'}</button></div></div>`}
shell(head('UNIDADE DE APRENDIZAGEM',u.title,u.theme)+`<div class="study-wrap">${body}</div>`)}
function lessonNextLearn(){const r=lessonRun;if(r.index<r.cards.length-1)r.index++;else{r.phase='grammar'}renderLesson()}
function lessonAnswer(i){const r=lessonRun,c=r.cards[r.quizIndex],ok=normAnswer(r.options[i])===normAnswer(c.pt);r.answers++;if(ok){r.correct++;celebrateGarden()}const fb=$('#lesson-feedback');fb.className='feedback '+(ok?'':'bad');fb.innerHTML=`<b>${ok?'Muito bem! 🌟':'Tudo bem, aprender também é tentar.'}</b><p>${ok?'Você reconheceu o significado.':`A resposta é ${esc(c.pt)}.`}</p><p><small>${esc(c.ex||'')}</small></p><button class="btn" onclick="lessonQuizNext()">Continuar →</button>`;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(normAnswer(r.options[j])===normAnswer(c.pt))b.classList.add('correct');else if(j===i&&!ok)b.classList.add('wrong')})}
function lessonQuizNext(){const r=lessonRun;if(r.quizIndex<r.cards.length-1){r.quizIndex++;renderLesson()}else{r.phase='build';renderLesson()}}
function lessonStartGrammarQuiz(){lessonRun.phase='grammarQuiz';renderLesson()}
function lessonGrammarAnswer(i){const r=lessonRun,u=lessonUnits.find(x=>x.id===r.id),g=grammarDetails[u.grammarTitle],ok=i===g.a;if(ok)celebrateGarden();const f=$('#grammar-feedback');f.className='feedback '+(ok?'':'bad');f.innerHTML=`<b>${ok?'Muito bem! Você aplicou a regra. 🌟':'Vamos revisar essa regra.'}</b><p>${esc(g.why)}</p><button class="btn" onclick="lessonStartQuiz()">${ok?'Continuar para os exercícios de vocabulário':'Entendi, continuar' } →</button>`;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===g.a)b.classList.add('correct');else if(j===i&&!ok)b.classList.add('wrong')})}
function lessonStartQuiz(){lessonRun.phase='quiz';lessonRun.quizIndex=0;renderLesson()}
function checkBuild(){const u=lessonUnits.find(x=>x.id===lessonRun.id),v=$('#lesson-build-answer')?.value||'',ok=normAnswer(v)===normAnswer(u.pattern);if(ok)celebrateGarden();const f=$('#lesson-build-feedback');f.className='feedback '+(ok?'':'bad');f.innerHTML=`<b>${ok?'Frase correta! 🌟':'Quase lá — observe o modelo.'}</b><p>${esc(u.pattern)}</p><button class="btn" onclick="lessonRun.phase='review';lessonRun.reviewIndex=0;renderLesson()">${ok?'Ir para a revisão':'Continuar para a revisão'}</button>`}
function revealReview(){$('#review-answer')?.classList.remove('hidden');const b=$('#review-next');if(b)b.disabled=false}
function reviewNext(){const r=lessonRun;if(r.reviewIndex<r.review.length-1){r.reviewIndex++;renderLesson()}else{S.unitProgress=S.unitProgress||{};S.unitProgress[r.id]={done:true,completedAt:Date.now(),accuracy:r.answers?Math.round(r.correct/r.answers*100):0};r.cards.forEach(c=>{c.seen=true;c.due=Math.max(Number(c.due)||0,Date.now()+86400000)});S.xp=(Number(S.xp)||0)+20;save();celebrateGarden({grand:true});lessonRun=null;toast('Unidade concluída! +20 XP 🌟');page='lessons';render()}}

function render(){if(!S)load();if(page==='home')shell(home());else if(page==='lessons'){if(lessonRun)renderLesson();else shell(lessonsPage())}else if(page==='cards')shell(cardsPage());else if(page==='stats')shell(statsPage());else if(page==='settings'){shell(settingsPage());refreshVoiceOptions()}else if(page==='adventure')shell(conversation?head('CONVERSAÇÃO','Fale inglês na vida real','Pratique situações do cotidiano, uma fala de cada vez.')+conversationPage():adventurePage());else if(page==='study'&&!session)shell(home())}
window.addEventListener('storage',e=>{if(e.key!==KEY||e.newValue===null)return;try{S=stateFromData(JSON.parse(e.newValue));render();toast('Dados atualizados em outra aba.')}catch(err){toast('Uma atualização externa continha dados inválidos; esta aba foi preservada.')}});try{navigator.storage?.persist?.()}catch{}load();render();
</script></body></html>
