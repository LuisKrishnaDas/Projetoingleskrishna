/* ── Vrindavan / Krishna-inspired visual theme ─────────────────────── */
:root{color-scheme:light;--bg:#f7f3e9;--panel:#fffdf7;--ink:#24294a;--muted:#77758a;--line:#e9dfc9;--purple:#344b83;--purple2:#253968;--pink:#d99b54;--mint:#65a99a;--yellow:#e8c36f;--blue:#72b7d3;--red:#c96b6b;--shadow:0 13px 34px #352d5012;--radius:20px}
body{background:radial-gradient(ellipse at 6% 5%,#e9e5d2 0,transparent 34%),radial-gradient(ellipse at 95% 22%,#e7eee4 0,transparent 30%),var(--bg);background-attachment:fixed}
#app{max-width:1180px}
.sidebar{background:linear-gradient(165deg,#fffdf8 0%,#f6f0e3 100%);border-color:#e4d6b8;box-shadow:0 16px 40px #2d31500d}
.brand{color:#26365f;letter-spacing:-.035em}
.brandmark{border-radius:50%;background:radial-gradient(circle at 35% 25%,#f7dc91,#b8873e 72%);box-shadow:0 4px 12px #a77a3528;font-size:21px}
.nav button{border-radius:12px;transition:background .2s,color .2s,transform .2s}
.nav button.active,.nav button:hover{background:linear-gradient(90deg,#e9e4d3,#f5ead2);color:#30477d}
.side-note{background:linear-gradient(135deg,#e9efe6,#f5ecd9);border:1px solid #e6dcc4;color:#59627a;line-height:1.65}
.eyebrow{color:#a47736;letter-spacing:.13em}
.page-head h1{color:#25345d;letter-spacing:-.045em}
.avatar{background:linear-gradient(145deg,#e9efe6,#f2e3c6);border:1px solid #e2d7bd;border-radius:50%;box-shadow:0 4px 12px #34365a0c}
.stat,.card{border-color:#e9dfca;box-shadow:0 9px 26px #39304b0a}
.stat{background:linear-gradient(145deg,#fffefa,#fcf8ef)}
.stat-icon{background:#f0e8d5!important;color:#9a713b}
.stat strong{color:#2b3c69}
.hero{background:radial-gradient(circle at 84% 22%,#587c9a 0,transparent 30%),linear-gradient(118deg,#202d5b 0%,#344c7d 57%,#4b7778 100%);border:1px solid #526b8d;box-shadow:0 18px 38px #202d5b28;padding:28px 30px}
.hero:after{content:'❀';font-family:serif;color:#f5d68e;font-size:210px;right:190px;top:-76px;opacity:.11;transform:rotate(12deg)}
.hero .pill{letter-spacing:.12em;font-size:10px}
.hero h2{font-family:'Comic Sans MS','Comic Sans',cursive;font-weight:600;letter-spacing:-.025em;font-size:clamp(25px,3vw,31px)}
.hero p{color:#e4e9ef}
.hero .btn{background:linear-gradient(135deg,#f5dfaa,#e6bd70);color:#28375f;box-shadow:0 4px 0 #b88d4c;font-weight:900}
.hero .btn:hover{filter:brightness(1.04)}
.krishna-art{width:172px;height:200px;display:grid;margin-bottom:16px;place-items:center;position:relative;flex:none;margin-right:18px;filter:drop-shadow(0 10px 14px #111a3c38)}
.krishna-art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#fff;border-radius:22px;padding:8px;border:3px solid #f0cf86;box-shadow:0 8px 20px #0d163a40}
.krishna-caption{position:absolute;bottom:-22px;white-space:nowrap;left:50%;transform:translateX(-50%);font-family:'Comic Sans MS','Comic Sans',cursive;font-size:12px;letter-spacing:.14em;color:#f8dfaa;text-shadow:0 1px 5px #15234c}
.section-head h2{color:#2d3e69;font-family:'Comic Sans MS','Comic Sans',cursive;font-weight:700}
.section-head button{color:#9a713b}
.quick-card{background:linear-gradient(145deg,#fffefa,#f8f3e8);border-color:#e8dec9}
.quick-card:hover{border-color:#c4a66b;box-shadow:0 12px 24px #6c573018}
.quick-card .qicon{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#f0eadb;color:#39547d}
.btn{background:linear-gradient(135deg,#3b548b,#283d70);box-shadow:0 4px 0 #1f315e}
.btn.soft{background:#e9eee7;color:#365e5c;box-shadow:none}
.btn.secondary{border-color:#e5dac4;background:#fffdf7;box-shadow:0 3px 0 #e9dfca}
.btn.danger{background:#bd6868;box-shadow:0 4px 0 #984e54}
.pill{background:#e6efe8;color:#3f796d}
.progress{background:#eee7d8}
.progress i{background:linear-gradient(90deg,#6da99a,#d2a65c)}
.field{background:#fffdf8;border-color:#e6dcc8}
.field:focus{border-color:#9d875b}
.word{background:linear-gradient(110deg,#fffefa,#fbf7ee);border-color:#e9dfca}
.icon-btn{background:#edf0e8;color:#385c66}
.study-kicker{color:#9b743b}
.option{background:#faf7ef;border-color:#e8dfcd}
.option.selected{border-color:#9d875b;background:#f2ead8}
.option.correct{border-color:#65a99a;background:#eaf3ed}
.option.wrong{border-color:#c96b6b;background:#f8eaea}
.feedback{background:#eaf3ed}
.feedback.bad{background:#f8eaea}
.chart-bars .bar-col i{background:linear-gradient(#d6b36d,#526f8d)}
.bottom-nav{background:color-mix(in srgb,#fffdf7 94%,transparent);border-top-color:#e6dcc8}
.bottom-nav button.active{color:#9a713b}
.toast{background:#26365f;color:#fffdf7}
.settings-row{border-color:#ece3d2}
@media(prefers-color-scheme:dark){
 :root{color-scheme:dark;--bg:#171d32;--panel:#222a43;--ink:#f4efdf;--muted:#b8b5bd;--line:#3b4359;--purple:#9db4d0;--purple2:#718cab;--pink:#d6a66a;--mint:#79b9a6;--yellow:#e8c36f;--blue:#83c5db;--red:#df8989;--shadow:0 12px 32px #0004}
 body{background:radial-gradient(ellipse at 6% 5%,#29334a 0,transparent 34%),radial-gradient(ellipse at 95% 22%,#253d3d 0,transparent 30%),var(--bg)}
 .sidebar,.stat,.card,.quick-card,.word{background:linear-gradient(145deg,#252e49,#20273e);border-color:#414a60}
 .brand,.page-head h1,.stat strong,.section-head h2{color:#f1e8d2}
 .brandmark{background:radial-gradient(circle at 35% 25%,#f7dc91,#9d7139 72%)}
 .nav button.active,.nav button:hover{background:#34425d;color:#e9ca8c}
 .side-note{background:linear-gradient(135deg,#293e42,#39354a);border-color:#47545d;color:#d2d0c5}
 .avatar{background:linear-gradient(145deg,#344b58,#4a4050);border-color:#536071}
 .stat-icon{background:#39445a!important;color:#e9ca8c}
 .hero{background:radial-gradient(circle at 84% 22%,#54788a 0,transparent 30%),linear-gradient(118deg,#172348,#2b426c 57%,#315e5a)}
 .hero .btn{background:linear-gradient(135deg,#f5dfaa,#d7ad63);color:#26345a}
 .hero p{color:#e1e7e7}
 .quick-card .qicon{background:#364458;color:#c5d9d1}
 .btn.soft,.icon-btn{background:#354b50;color:#c7dfd6}
 .btn.secondary{background:#28314a;border-color:#465067}
 .field,.option{background:#1d253c;border-color:#465067}
 .word{background:linear-gradient(110deg,#252e49,#20273e)}
 .option.selected{background:#34425d;border-color:#d0b477}
 .option.correct,.feedback{background:#29433f}
 .option.wrong,.feedback.bad{background:#4a303a}
 .progress{background:#3a4358}
 .bottom-nav{background:color-mix(in srgb,#202840 95%,transparent);border-top-color:#414b61}
 .toast{background:#f1e8d2;color:#26365f}
}
@media(max-width:800px){
 #app{padding:15px 14px 100px}
 .hero{padding:22px 20px}
 .krishna-art{width:124px;height:144px;margin-right:0}
 .hero:after{right:105px;font-size:160px}
 .bottom-nav{background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(18px)}
}
@media(max-width:480px){
 .hero{padding:19px 17px}
 .hero-row{align-items:center}
 .hero-emoji.krishna-art{display:grid;width:92px;height:107px;margin:-4px -2px 14px 0}
 .krishna-art img{border-radius:16px;padding:4px;border-width:2px}
 .krishna-caption{font-size:9px}
 .hero h2{font-size:21px;max-width:230px}
 .hero p{font-size:13px;max-width:235px}
 .hero:after{right:50px;top:-52px;font-size:135px}
 .page-head h1{font-size:27px}
}


/* Segunda etapa · painel de progresso mais claro e acolhedor */
.home-progress{padding:21px 22px;background:linear-gradient(145deg,#fffefa,#f7f2e6)}
.today-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.today-progress-number{font-size:27px;font-weight:900;letter-spacing:-.04em;color:#2b3c69;margin-top:3px}
.today-progress-number span{font-size:14px;font-weight:650;letter-spacing:0;color:var(--muted)}
.today-progress-badge{padding:8px 12px;border-radius:999px;background:#eaf1e7;color:#476d62;font-size:12px;font-weight:800}
.week-activity{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:21px 4px 13px;height:88px}
.week-day{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.week-bar-track{height:65px;width:100%;max-width:30px;border-radius:10px;background:#eee8d9;display:flex;align-items:end;overflow:hidden}
.week-bar-track i{display:block;width:100%;min-height:4px;border-radius:10px;background:#d7c69e;transition:height .25s}
.week-bar-track i.has-activity{background:linear-gradient(180deg,#79ad9d,#3e7181)}
.week-day b{font-size:11px;color:var(--muted);font-weight:750}
.week-day b.is-today{color:#9a713b}
.today-progress-foot{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid #e9dfca;color:var(--muted);font-size:12px}
.today-progress-foot b{color:#3f796d}
.day-summary{display:flex;align-items:center;justify-content:space-between;gap:18px}
.day-summary>div:first-child{min-width:0}
.day-summary p{font-size:13px;margin:6px 0 0}
.summary-icon{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:10px;background:#f1e9d8}
.summary-score{text-align:center;flex:none;padding:10px 16px;border-radius:16px;background:#edf2e9}
.summary-score strong{display:block;font-size:25px;color:#47796e;line-height:1.1}
.summary-score small{font-size:11px;color:#64796f}
@media(prefers-color-scheme:dark){.home-progress{background:linear-gradient(145deg,#252e49,#20273e)}.today-progress-badge,.summary-score{background:#354b50;color:#c7dfd6}.week-bar-track{background:#3b4359}.week-bar-track i.has-activity{background:linear-gradient(180deg,#8bc4ad,#547f92)}.today-progress-foot{border-color:#414a60}.summary-icon{background:#39445a}.summary-score strong{color:#9bcbb8}}
@media(max-width:480px){.home-progress{padding:17px}.today-progress-head{align-items:flex-start;flex-direction:column}.today-progress-badge{align-self:flex-start}.week-activity{gap:7px}.today-progress-foot{font-size:11px}.day-summary{align-items:flex-start}.summary-score{padding:9px 11px}}


/* Etapa 4 · conquistas e recompensas visuais */
.achievement-panel{background:linear-gradient(145deg,#fffefa,#f7f2e6)}

// Celebração de conquista: sino de duas notas e lótus em flor.
let gardenAudioContext=null,gardenCelebrationTimer=null;
function playGardenBell(){
 if(S?.settings?.successSound===false)return;
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;
  gardenAudioContext=gardenAudioContext||new AudioCtx();
  if(gardenAudioContext.state==='suspended')gardenAudioContext.resume();
  const ctx=gardenAudioContext,now=ctx.currentTime;
  // Duas batidas de sino com parciais harmônicas suaves.
  [[784,0],[988,.24]].forEach(([frequency,delay])=>{
   const start=now+delay;
   [[1,.105],[2.01,.025],[2.76,.012]].forEach(([partial,level])=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(frequency*partial,start);
    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(level,start+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,start+1.05);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(start);osc.stop(start+1.08);
   });
  });
 }catch(e){/* áudio é opcional; a resposta correta continua normalmente */}
}
function celebrateGarden(options={}){
 const settings=S?.settings||{};
 if(settings.successSound!==false)playGardenBell();
 if(settings.successAnimation===false||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 document.querySelector('.garden-celebration')?.remove();
 if(gardenCelebrationTimer)clearTimeout(gardenCelebrationTimer);
 const wrap=document.createElement('div');wrap.className='garden-celebration'+(options.grand?' garden-celebration-grand':'');
 wrap.setAttribute('aria-hidden','true');
 wrap.innerHTML=`<div class="garden-celebration-halo"></div><div class="garden-krishna"><img src="./assets/krishna-celebration.png" alt=""></div>
 <span class="garden-sparkle sparkle-one">✧</span><span class="garden-sparkle sparkle-two">✦</span><span class="garden-sparkle sparkle-three">✧</span>
 <i class="garden-petal petal-one"></i><i class="garden-petal petal-two"></i><i class="garden-petal petal-three"></i><i class="garden-petal petal-four"></i>`;
 const host=$('#feedback');
 if(host){host.classList.add('garden-feedback-host');host.appendChild(wrap)}else{document.body.appendChild(wrap)}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2600)}
function availableEnglishVoices(){return ('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en([_-]|$)/i.test(v.lang))}
function preferredVoice(voices){const saved=S?.settings?.voiceName;if(saved){const exact=voices.find(v=>v.name===saved);if(exact)return exact}const priorities=[/Google US English/i,/Microsoft Aria/i,/Microsoft Jenny/i,/Samantha/i,/Ava/i,/Allison/i,/Karen/i,/English United States/i,/en-US/i];for(const p of priorities){const found=voices.find(v=>p.test(v.name)||p.test(v.lang));if(found)return found}return voices[0]||null}
let premiumAudioManifest={};let currentPremiumAudio=null;
fetch('./audio/manifest.json').then(r=>r.ok?r.json():{}).then(data=>{premiumAudioManifest=data&&typeof data==='object'?data:{}}).catch(()=>{});
function speakFallback(text,rate,language='en'){
 if(!('speechSynthesis'in window)){toast('Áudio não disponível neste navegador.');return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=language==='pt'?'pt-BR':'en-US';
 u.rate=rate;
 const voices=speechSynthesis.getVoices();
 u.voice=language==='pt'
  ?(voices.find(v=>/^pt-BR/i.test(v.lang))||voices.find(v=>/^pt/i.test(v.lang))||null)
  :preferredVoice(availableEnglishVoices());
 speechSynthesis.speak(u)
}
function speak(text,rate=S.settings.voiceRate,language='en'){
 const key=language+'|'+norm(text),path=premiumAudioManifest[key];
 if(path){
  try{
   if('speechSynthesis'in window)speechSynthesis.cancel();
   if(currentPremiumAudio){currentPremiumAudio.pause();currentPremiumAudio.currentTime=0}
   currentPremiumAudio=new Audio('./'+path);
   currentPremiumAudio.play().catch(()=>speakFallback(text,rate,language));
   return
  }catch(e){speakFallback(text,rate,language);return}
 }
 speakFallback(text,rate,language)
}
function refreshVoiceOptions(){const sel=$('#voice');if(!sel)return;const voices=availableEnglishVoices();const current=S.settings.voiceName;sel.innerHTML='<option value="">✨ Melhor voz disponível automaticamente</option>'+voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} · ${esc(v.lang)}</option>`).join('');if(current&&voices.some(v=>v.name===current))sel.value=current;if(!voices.length)sel.innerHTML='<option value="">Nenhuma voz inglesa encontrada neste dispositivo</option>'}

function achievementData(){const totalAnswers=Object.values(S.log||{}).reduce((n,d)=>n+(Number(d?.n)||0),0),days=Object.keys(S.log||{}).filter(k=>Number(S.log[k]?.n)>0).sort(),bestStreak=(()=>{let best=0,run=0,prev=null;for(const key of days){const d=new Date(key+'T12:00:00');if(prev){const diff=Math.round((d-prev)/86400000);run=diff===1?run+1:1}else run=1;best=Math.max(best,run);prev=d}return best})();const items=[{id:'first',icon:'🌱',name:'Primeiro broto',desc:'Registre sua primeira resposta',ok:totalAnswers>=1,progress:Math.min(totalAnswers,1),goal:1},{id:'ten',icon:'✍️',name:'Mão na massa',desc:'Responda 10 questões',ok:totalAnswers>=10,progress:Math.min(totalAnswers,10),goal:10},{id:'hundred',icon:'📚',name:'Colecionador de palavras',desc:'Registre 100 respostas',ok:totalAnswers>=100,progress:Math.min(totalAnswers,100),goal:100},{id:'daily',icon:'🌟',name:'Dia florescido',desc:'Complete a meta diária de 10 respostas',ok:(Number(S.log[today()]?.n)||0)>=10,progress:Math.min(Number(S.log[today()]?.n)||0,10),goal:10},{id:'streak3',icon:'🔥',name:'Constância',desc:'Estude por 3 dias seguidos',ok:bestStreak>=3,progress:Math.min(bestStreak,3),goal:3},{id:'streak7',icon:'☀️',name:'Uma semana de constância',desc:'Estude por 7 dias seguidos',ok:bestStreak>=7,progress:Math.min(bestStreak,7),goal:7},{id:'xp100',icon:'⚡',name:'Energia positiva',desc:'Conquiste 100 pontos de XP',ok:S.xp>=100,progress:Math.min(S.xp,100),goal:100},{id:'xp500',icon:'🏅',name:'Dedicação dourada',desc:'Conquiste 500 pontos de XP',ok:S.xp>=500,progress:Math.min(S.xp,500),goal:500},{id:'master10',icon:'💎',name:'Memória forte',desc:'Tenha 10 cartões bem fixados',ok:S.cards.filter(c=>c.ivl>=21).length>=10,progress:Math.min(S.cards.filter(c=>c.ivl>=21).length,10),goal:10}];return{items,totalAnswers,bestStreak,unlocked:items.filter(x=>x.ok).length}}

function learningPath(){const seen=S.cards.filter(c=>c.seen).length;const levels=[{name:'Primeiros passos',range:'0–9 palavras',need:0,desc:'Reconheça palavras com apoio e apenas três alternativas.',emoji:'🌱'},{name:'Palavras do dia a dia',range:'10–24 palavras',need:10,desc:'Ligue inglês e português nos dois sentidos.',emoji:'🌼'},{name:'Frases ganhando forma',range:'25–49 palavras',need:25,desc:'Comece a escrever com dicas e exemplos.',emoji:'🌿'},{name:'Escuta com confiança',range:'50–99 palavras',need:50,desc:'Treine listening e traduções sem tantas pistas.',emoji:'🎧'},{name:'Independência',range:'100+ palavras',need:100,desc:'Misture desafios e pratique com mais autonomia.',emoji:'🏆'}];let idx=0;for(let i=0;i<levels.length;i++)if(seen>=levels[i].need)idx=i;const current=levels[idx],next=levels[idx+1],pct=next?Math.min(100,Math.round((seen-current.need)/(next.need-current.need)*100)):100;return{seen,idx,current,next,pct,levels}}

function editCard(id){editingId=id||null;const c=id?S.cards.find(x=>x.id===id):null;const old=$('#modal');if(old)old.remove();const m=document.createElement('div');m.id='modal';m.style='position:fixed;inset:0;background:#15122a99;z-index:30;display:grid;place-items:center;padding:16px';m.innerHTML=`<div class="card" style="width:min(520px,100%);max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${c?'Editar cartão':'Novo cartão'} ✨</h2><button class="icon-btn" onclick="$('#modal').remove()">✕</button></div><div style="margin-top:18px"><label>INGLÊS</label><input id="f-en" class="field" value="${esc(c?.en||'')}" placeholder="e.g. figure out"><label>PORTUGUÊS</label><input id="f-pt" class="field" value="${esc(c?.pt||'')}" placeholder="descobrir, entender"><label>FRASE DE EXEMPLO</label><textarea id="f-ex" class="field" rows="2" placeholder="I can't figure out this problem.">${esc(c?.ex||'')}</textarea><label>CATEGORIA</label><input id="f-cat" class="field" value="${esc(c?.category||'Geral')}" placeholder="Viagens, trabalho, cotidiano..."><button class="btn" style="width:100%;margin-top:8px" onclick="saveCard()">Salvar cartão 💜</button></div></div>`;document.body.append(m);$('#f-en').focus()}
function saveCard(){const en=$('#f-en').value.trim(),pt=$('#f-pt').value.trim(),ex=$('#f-ex').value.trim(),category=$('#f-cat').value.trim()||'Geral';if(!en||!pt){toast('Preencha inglês e português.');return}const existing=editingId?S.cards.find(x=>x.id===editingId):null;const previous=existing?{...existing}:null;if(existing)Object.assign(existing,{en,pt,ex,category});else S.cards.unshift({...makeCard(en,pt,ex),category});if(!save()){if(existing)Object.assign(existing,previous);else S.cards.shift();return}$('#modal').remove();toast('Cartão salvo! 💜');cardsRefresh()}
function deleteCard(id){const index=S.cards.findIndex(x=>x.id===id),c=S.cards[index];if(!c||!confirm(`Excluir “${c.en}”?`))return;S.cards.splice(index,1);if(!save()){S.cards.splice(index,0,c);return}toast('Cartão excluído.');cardsRefresh()}
function bulkAdd(){const el=$('#bulk');let n=0;el.value.split(/\r?\n/).forEach(line=>{const [en,pt,ex='']=line.split('|').map(x=>x.trim());if(en&&pt&&!S.cards.some(c=>norm(c.en)===norm(en))) {S.cards.push(makeCard(en,pt,ex));n++}});save();toast(`${n} cartão(ões) adicionado(s)!`);cardsRefresh()}
function allowedQuestionTypes(mode){const level=learningPath().idx;if(mode==='listen')return level>=3?['listen']:['choice'];if(mode==='write')return level>=2?['write']:['choice'];if(mode==='practice'||mode==='daily'||mode==='weak'){const types=['choice'];if(level>=1)types.push('reverse');if(level>=2)types.push('write');if(level>=3)types.push('listen','translate');return types}return ['choice']}
function startStudy(mode){const level=learningPath().idx;if(mode==='write'&&level<2){toast('A escrita ativa será liberada na etapa 3. Continue sua trilha com calma!');return}if(mode==='listen'&&level<3){toast('O listening será liberado na etapa 4. Primeiro vamos fortalecer o reconhecimento!');return}let pool;if(mode==='daily'){const due=S.cards.filter(c=>c.seen&&c.due<=Date.now()).sort((a,b)=>(Number(b.lapses||0)*3+Math.max(0,2.5-(Number(b.ease)||2.5))*4)-(Number(a.lapses||0)*3+Math.max(0,2.5-(Number(a.ease)||2.5))*4)||a.due-b.due);const fresh=shuffle(S.cards.filter(c=>!c.seen));const slots=Math.max(0,50-Math.min(50,due.length));pool=shuffle([...due.slice(0,50),...fresh.slice(0,slots)])}else if(mode==='weak'){pool=S.cards.filter(c=>c.seen&&(Number(c.mistakes)||0)>0||(c.seen&&(Number(c.lapses)||0)>0)).sort((a,b)=>((Number(b.mistakes)||0)*2+(Number(b.lapses)||0))-((Number(a.mistakes)||0)*2+(Number(a.lapses)||0))).slice(0,30)}else if(mode==='practice')pool=shuffle(S.cards.filter(c=>c.seen));else if(mode==='write')pool=shuffle(S.cards.filter(c=>c.pt));else pool=shuffle(S.cards.filter(c=>c.en));if(!pool.length){toast('Ainda não há cartões para esse modo. Adicione alguns!');return}session={mode,queue:pool.slice(0,mode==='daily'?20:10),index:0,correct:0,answered:0,earned:0,current:null,choice:null,done:false};page='study';showQuestion()}
function listenText(card){return String(card.ex||card.en||'').trim()}
function showQuestion(){if(!session||session.index>=session.queue.length){finishStudy();return}const s=session,c=s.queue[s.index];s.current=c;s.choice=null;s.done=false;const mode=s.mode;const types=allowedQuestionTypes(mode);let type=types[Math.floor(Math.random()*types.length)];if(type===s.previousType&&types.length>1){const alternatives=types.filter(x=>x!==type);type=alternatives[Math.floor(Math.random()*alternatives.length)]}s.previousType=type;s.type=type;let question='',opts=[];const distractors=(field,correctField)=>shuffle(S.cards.filter(x=>x.id!==c.id&&String(x[field]||'').trim()&&normAnswer(x[field])!==normAnswer(c[correctField])).map(x=>x[field])).filter((v,i,a)=>a.findIndex(z=>normAnswer(z)===normAnswer(v))===i).slice(0,learningPath().idx>=2?3:2);if(type==='listen'){question=`<p class="study-hint">Ouça com atenção e escreva o que ouviu.</p><button class="btn soft" style="margin:20px auto" onclick="speak(listenText(session.current))">🔊 Ouvir áudio</button><input id="answer" class="field study-input" placeholder="Escreva o que você ouviu" autocomplete="off">`}else if(type==='write'){question=`<div class="study-question">${esc(c.pt)}</div><p class="study-hint">Escreva em inglês. ${learningPath().idx===2?'Dica: pense na primeira palavra e consulte o exemplo, se houver.':''}</p>${c.ex?`<p class="muted" style="font-size:13px">Exemplo: ${esc(c.ex)}</p>`:''}<input id="answer" class="field study-input" placeholder="Sua resposta em inglês" autocomplete="off">`}else if(type==='translate'){question=`<div class="study-question">${esc(c.en)}</div><p class="study-hint">Agora escreva o significado em português.</p><input id="answer" class="field study-input" placeholder="Tradução em português" autocomplete="off">`}else if(type==='reverse'){opts=shuffle([c.pt,...distractors('pt','pt')]);s.options=opts;question=`<div class="study-question">${esc(c.en)}</div><p class="study-hint">O que essa expressão significa?</p><div class="options">${opts.map((o,i)=>`<button type="button" class="option" aria-pressed="false" onclick="choose(${i})">${esc(o)}</button>`).join('')}</div>`}else{opts=shuffle([c.en,...distractors('en','en')]);s.options=opts;question=`<div class="study-question">${esc(c.pt)}</div><p class="study-hint">Escolha a expressão em inglês que corresponde.</p><div class="options">${opts.map((o,i)=>`<button type="button" class="option" aria-pressed="false" onclick="choose(${i})">${esc(o)}</button>`).join('')}</div>`}const pct=Math.round(s.index/s.queue.length*100);const symbols=['triratna','ahimsa-hand','hamsa','chhatra','golden-fish','kamandalu','uraeus','sistrum'];const deco=symbols[Math.floor(Math.random()*symbols.length)];const labels={choice:'🧩 Escolha a resposta',reverse:'🔎 Entenda o significado',write:'✍️ Escrita ativa',listen:'🎧 Listening',translate:'🌍 Tradução reversa'};shell(`<div class="study-wrap"><div class="study-top"><button class="btn secondary small" onclick="leaveStudy()">✕</button><div class="progress"><i style="width:${pct}%"></i></div><b>${s.index+1}/${s.queue.length}</b></div><div class="card study-card"><div class="exercise-ornament" aria-hidden="true">${ornament(deco,'question-ornament')}</div><div class="study-kicker">${labels[type]}</div>${question}<div id="feedback"></div><div class="study-actions" id="study-actions">${type==='listen'||type==='write'||type==='translate'?'<button class="btn" onclick="checkAnswer()">Verificar resposta</button>':''}</div></div></div>`);if(type==='listen'&&S.settings.autoSpeak)setTimeout(()=>speak(listenText(c)),350);if(type==='write'||type==='listen'||type==='translate')$('#answer')?.focus()}
function revealNew(){const c=session.current;c.seen=true;c.due=Date.now()+86400000;save();session.index++;showQuestion()}
function choose(index){const s=session;if(!s||s.done||!Array.isArray(s.options)||index<0||index>=s.options.length)return;s.choice=index;document.querySelectorAll('.option').forEach((button,i)=>{button.classList.toggle('selected',i===index);button.setAttribute('aria-pressed',i===index?'true':'false')});const actions=$('#study-actions');if(actions)actions.innerHTML='<button class="btn" onclick="checkAnswer()">Confirmar resposta</button>';}
function checkAnswer(){const s=session,c=s.current;let answer,expected,correct;if(s.type==='choice'||s.type==='reverse'){if(s.choice==null){toast('Escolha uma opção primeiro.');return}answer=s.options[s.choice];expected=s.type==='reverse'?c.pt:c.en;correct=normAnswer(answer)===normAnswer(expected)}else{answer=$('#answer')?.value.trim()||'';if(!answer){toast('Digite sua resposta primeiro.');return}expected=s.type==='listen'?listenText(c):s.type==='translate'?c.pt:c.en;correct=normAnswer(answer)===normAnswer(expected)}s.done=true;s.answered++;c.attempts=(Number(c.attempts)||0)+1;if(!correct)c.mistakes=(Number(c.mistakes)||0)+1;let xpAwarded=false;if(correct){s.correct++;xpAwarded=awardXp(c.id,10);if(xpAwarded)s.earned+=10;celebrateGarden()}const fb=$('#feedback');fb.className='feedback '+(correct?'':'bad');fb.innerHTML=`<b>${correct?(xpAwarded?'Acertou! +10 XP 🎉':'Acertou! Você já recebeu XP por este cartão hoje. 🌟'):'Quase! Vamos aprender com essa.'}</b><p style="margin:6px 0 0">${correct?'Muito bem!':`Resposta esperada: <b>${esc(expected)}</b>`}</p><small>Inglês: ${esc(c.en)} · Português: ${esc(c.pt)}</small>${c.ex?`<p><small>Exemplo: ${esc(c.ex)}</small></p>`:''}${!correct&&learningPath().idx<2?'<p><small>💡 Dica: observe a tradução e tente repetir a palavra em voz alta antes de continuar.</small></p>':''}`;document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;const target=s.type==='reverse'?c.pt:c.en;if(norm(s.options[i])===norm(target))b.classList.add('correct');else if(i===s.choice&&!correct)b.classList.add('wrong')});$('#study-actions').innerHTML='<button class="btn" onclick="nextQuestion('+correct+')">Continuar →</button>';if(correct)speak(c.en)}
function nextQuestion(correct){const s=session,c=s.current;const L=S.log[today()]||(S.log[today()]={n:0,ok:0});L.n++;if(correct)L.ok++;if(s.mode==='daily'||s.mode==='weak'){c.seen=true;if(correct){const intervals=[1,3,7,14,30,60];c.reps=(c.reps||0)+1;c.ease=Math.min(3.0,(c.ease||2.5)+.05);c.ivl=intervals[Math.min(c.reps-1,intervals.length-1)];const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+c.ivl);c.due=d.getTime()}else{c.lapses=(c.lapses||0)+1;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,(c.ease||2.5)-.2);c.due=Date.now()+10*60*1000}}save();s.index++;showQuestion()}
function leaveStudy(){if(confirm('Encerrar esta rodada agora?')){session=null;page='home';render()}}
function finishStudy(){const s=session;session=null;page='study';const pct=s.answered?Math.round(s.correct/s.answered*100):0;shell(`<div class="card empty completion"><div class="completion-art" aria-hidden="true">${ornament('sudarshana','slow-mandala')}<img class="round-portrait" src="img/round-complete-portrait.jpg" alt="Ilustração enviada para celebrar a rodada concluída" width="180" height="229">${ornament('bennu','celebration-lotus')}</div><div class="big-emoji">${pct>=80?'🏆':'🌈'}</div><div class="eyebrow">RODADA CONCLUÍDA</div><h1 style="font-size:32px">Mandou bem demais!</h1><p class="muted">Você dedicou um tempinho ao seu inglês. Isso já é uma vitória. 💜</p><div class="grid stats" style="margin:24px 0;text-align:left"><div class="stat"><strong>${s.answered}</strong><small>respondidas</small></div><div class="stat"><strong>${pct}%</strong><small>de acerto</small></div><div class="stat"><strong>+${s.earned}</strong><small>XP conquistados</small></div><div class="stat"><strong>${s.correct}</strong><small>acertos</small></div></div><button class="btn" onclick="page='home';render()">Voltar ao início 🏠</button> <button class="btn secondary" onclick="startStudy('practice')">Praticar mais</button></div>`);}
function learningInsights(){const seen=S.cards.filter(c=>c.seen),weak=seen.filter(c=>(Number(c.mistakes)||0)>0||(Number(c.lapses)||0)>0).sort((a,b)=>((Number(b.mistakes)||0)*2+(Number(b.lapses)||0))-((Number(a.mistakes)||0)*2+(Number(a.lapses)||0))).slice(0,5),steady=seen.filter(c=>(Number(c.mistakes)||0)===0&&(Number(c.lapses)||0)===0).length;return{weak,steady,seen:seen.length,attempts:seen.reduce((n,c)=>n+(Number(c.attempts)||0),0),mistakes:seen.reduce((n,c)=>n+(Number(c.mistakes)||0),0)}}

function conversationRecord(id){if(!S.conversationProgress||typeof S.conversationProgress!=='object')S.conversationProgress={};if(!S.conversationProgress[id])S.conversationProgress[id]={sessions:0,completed:0,attempts:0,successes:0,totalPct:0,bestPct:0,lastAt:''};return S.conversationProgress[id]}

function startConversation(id){const scenario=conversationScenarios.find(x=>x.id===id);if(!scenario)return;const record=conversationRecord(id);record.sessions=(Number(record.sessions)||0)+1;save();conversation={scenario,index:0,history:[],last:null};render()}
function conversationPage(){const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);if(!conversation)return `<div class="section-head"><h2>Escolha uma situação</h2></div><p class="muted">Pratique respostas úteis em conversas do dia a dia. Você pode digitar ou falar — sem pressa.</p><div class="card" style="margin-bottom:16px"><div class="eyebrow">SUGESTÃO PARA SEU PRÓXIMO TREINO</div><b>${recommendedConversation().emoji} ${esc(recommendedConversation().title)}</b><p class="muted" style="margin:6px 0 12px">${(S.conversationProgress?.[recommendedConversation().id]?.attempts||0)?'Esta é a situação com a menor média registrada. Um pouco de prática pode ajudar!':'Comece por uma conversa simples e ganhe confiança.'}</p><button class="btn" onclick="startConversation('${recommendedConversation().id}')">Praticar sugestão ✨</button></div><div class="grid quick">${conversationScenarios.map(x=>{const r=S.conversationProgress?.[x.id]||{sessions:0,attempts:0,completed:0};return `<button class="card quick-card" onclick="startConversation('${x.id}')"><span class="qicon">${x.emoji}</span><span><b>${x.title}</b><small>${x.intro}</small><small class="pill" style="margin-top:8px">${x.level} · ${x.turns.length} falas</small><small>${r.sessions?`${r.sessions} treino(s) · média ${conversationScore(x.id)}%`:'Ainda não praticada'}</small></span></button>`}).join('')}</div>`;const sc=conversation.scenario,t=sc.turns[conversation.index],done=conversation.index>=sc.turns.length;return `<div class="toolbar"><button class="btn secondary small" onclick="conversation=null;render()">← Situações</button><span class="pill">${sc.emoji} ${sc.title}</span><span class="muted">${done?'Concluído':`Fala ${conversation.index+1} de ${sc.turns.length}`}</span></div><div class="study-wrap"><div class="study-top"><div class="progress"><i style="width:${done?100:conversation.index/sc.turns.length*100}%"></i></div></div><div class="card study-card"><div class="study-kicker">CONVERSA DO DIA A DIA</div>${done?`<div class="study-question">Muito bem! 🎉</div><p class="study-hint">Você concluiu “${sc.title}”. Cada conversa é mais um passo na sua confiança.</p><div class="feedback">${conversation.history.map((h,i)=>`<p><b>${i+1}. ${esc(h.target)}</b><br><small class="muted">Sua resposta: ${esc(h.answer||'—')} · ${h.pct}% de correspondência</small></p>`).join('')}</div><div class="study-actions"><button class="btn" onclick="conversation=null;render()">Escolher outra conversa</button><button class="btn secondary" onclick="startConversation('${sc.id}')">Repetir conversa</button></div>`:`<div class="dialogue-bubble"><small>OUTRA PESSOA</small><p class="study-question" style="font-size:clamp(20px,4vw,29px)">${esc(t.other)}</p><button class="btn soft small" onclick="speak(${esc(JSON.stringify(t.other))})">🔊 Ouvir fala</button><p class="muted" style="margin-top:12px">${esc(t.pt)}</p></div><div class="feedback" style="text-align:center"><b>Sua vez de responder</b><p>${esc(t.hint)}</p><p class="muted" style="font-size:12px">Resposta sugerida: ${esc(t.target)}</p></div>${conversation.last?`<div class="feedback ${conversation.last.ok?'':'bad'}"><b>${conversation.last.ok?'Boa resposta! 🌟':'Ótima tentativa — compare com o modelo.'}</b><p>O navegador entendeu: <b>${esc(conversation.last.answer)}</b></p><p>Correspondência aproximada: <b>${conversation.last.pct}%</b></p><p>Modelo: <b>${esc(t.target)}</b></p></div>`:`<input id="conversation-answer" class="field study-input" placeholder="Digite sua resposta em inglês" autocomplete="off"><div class="study-actions"><button class="btn soft" onclick="speak(${esc(JSON.stringify(t.target))})">🔊 Ouvir modelo</button>${supported?'<button class="btn soft" id="conversation-mic" onclick="recordConversation()">🎙️ Responder falando</button>':''}<button class="btn" onclick="submitConversation()">Verificar resposta</button></div>`}<div class="study-actions">${conversation.last?'<button class="btn" onclick="advanceConversation()">Próxima fala →</button>':''}</div>`}</div><p class="muted" style="font-size:12px;text-align:center;margin-top:12px">A porcentagem compara a transcrição do navegador com a resposta sugerida. É uma estimativa, não uma avaliação fonética.</p></div>`}
function submitConversation(spoken){if(!conversation||conversation.index>=conversation.scenario.turns.length||conversation.last)return;const input=$('#conversation-answer');const answer=String(spoken??input?.value??'').trim();if(!answer){toast('Digite ou fale sua resposta primeiro.');return}const target=conversation.scenario.turns[conversation.index].target;const pct=Math.round(stringSimilarity(norm(answer),norm(target))*100);const ok=pct>=65;const record=conversationRecord(conversation.scenario.id);record.attempts=(Number(record.attempts)||0)+1;record.totalPct=(Number(record.totalPct)||0)+pct;record.bestPct=Math.max(Number(record.bestPct)||0,pct);if(ok)record.successes=(Number(record.successes)||0)+1;record.lastAt=today();save();conversation.last={answer,pct,ok};render()}
function recordConversation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{if(recognition)recognition.abort();recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;const b=$('#conversation-mic');if(b){b.disabled=true;b.textContent='🎧 Ouvindo...'}recognition.onresult=e=>submitConversation(e.results[0][0]?.transcript||'');recognition.onerror=e=>toast(e.error==='not-allowed'?'Permita o acesso ao microfone.':'Não consegui reconhecer. Tente novamente.');recognition.onend=()=>{const btn=$('#conversation-mic');if(btn){btn.disabled=false;btn.textContent='🎙️ Responder falando'}};recognition.start()}catch(e){toast('Não foi possível iniciar o microfone.')}}
function advanceConversation(){if(!conversation?.last)return;conversation.history.push({target:conversation.scenario.turns[conversation.index].target,...conversation.last});conversation.index++;conversation.last=null;if(conversation.index>=conversation.scenario.turns.length){const record=conversationRecord(conversation.scenario.id);record.completed=(Number(record.completed)||0)+1;save()}render()}
function adventurePage(){const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);if(!adventureCard){const pool=S.cards.filter(c=>c.en&&c.en.trim());adventureCard=pool[Math.floor(Math.random()*pool.length)]||null;adventureResult=null}const c=adventureCard;if(!c)return head('TREINO DE FALA','A melodia das palavras','Seu vocabulário ainda está vazio.')+`<div class="card empty"><div class="big-emoji">📚</div><p>Adicione alguns cartões para começar o treino de palavras, ou pratique uma conversa.</p><div class="study-actions"><button class="btn" onclick="go('cards')">Criar cartões</button><button class="btn secondary" onclick="renderConversationMode()">💬 Praticar conversação</button></div></div>`;return head('TREINO DE FALA','A melodia das palavras','Uma palavra de cada vez. Sem pressão — é treino!')+`<div class="toolbar"><button class="btn secondary small" onclick="conversation=null;render()">🎙️ Palavra</button><button class="btn small" onclick="renderConversationMode()">💬 Conversação</button></div><div class="study-wrap"><div class="card study-card"><div class="exercise-ornament" aria-hidden="true">${ornament(page==='adventure'||session?.type==='listen'?'damaru':session?.type==='write'?'feather-of-maat':'ghanta')}</div><div class="study-kicker">MISSÃO DE FALA · ${supported?'MICROFONE DISPONÍVEL':'MICROFONE NÃO SUPORTADO'}</div><div class="study-question">${esc(c.en)}</div><p class="study-hint">${esc(c.pt)}</p>${c.ex?`<p class="muted" style="margin-top:12px">Exemplo: ${esc(c.ex)}</p>`:''}<div class="study-actions"><button class="btn soft" onclick="speakAdventureModel()">🔊 Ouvir modelo</button><button class="btn" id="micBtn" onclick="startPronunciation()" ${supported?'':'disabled'}>🎙️ ${adventureResult?'Tentar novamente':'Falar agora'}</button></div><div id="pronunciation-feedback">${adventureResult?adventureResult.html:`<p class="muted" style="margin-top:18px">${supported?'Toque em “Falar agora”, permita o microfone e diga a expressão em voz alta.':'Use Chrome ou Edge em uma conexão HTTPS (como seu site no Netlify) para habilitar o reconhecimento de fala.'}</p>`}</div><div class="study-actions"><button class="btn secondary" onclick="nextAdventure()">Próxima palavra →</button></div></div><p class="muted" style="font-size:12px;text-align:center;margin-top:12px">A avaliação compara o texto reconhecido pelo navegador com a palavra-alvo. É uma estimativa de reconhecimento, não uma análise fonética perfeita.</p></div>`}
function renderConversationMode(){conversation=null;page='adventure';shell(head('CONVERSAÇÃO','Fale inglês na vida real','Escolha uma situação e pratique respostas úteis.')+conversationPage())}
function speakAdventureModel(){if(adventureCard)speak(adventureCard.en)}
function startPronunciation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Este navegador não oferece reconhecimento de fala.');return}try{if(recognition)recognition.abort();recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=3;const btn=$('#micBtn');if(btn){btn.disabled=true;btn.textContent='🎧 Ouvindo...'}recognition.onresult=e=>{const transcript=e.results[0][0]?.transcript||'';const target=adventureCard.en;const similarity=stringSimilarity(norm(transcript),norm(target));const pct=Math.round(similarity*100);const ok=pct>=82;const L=S.log[today()]||(S.log[today()]={n:0,ok:0});L.n++;if(ok)L.ok++;const xpAwarded=ok?awardXp(adventureCard.id,15):false;save();adventureResult={transcript,pct,html:`<div class="feedback ${ok?'':'bad'}"><b>${ok?(xpAwarded?'Muito bem! Sua fala foi reconhecida! 🎉 +15 XP':'Muito bem! Sua fala foi reconhecida. Você já recebeu XP por este cartão hoje. 🌟'):'Boa tentativa! Vamos mais uma vez. 💜'}</b><p>O navegador entendeu: <b>${esc(transcript)}</b></p><p>Correspondência aproximada: <b>${pct}%</b></p><small>${ok?'A expressão foi reconhecida de forma próxima ao modelo.':'Ouça o modelo, observe os sons e tente novamente.'}</small></div>`};renderAdventureFeedback()};recognition.onerror=e=>{toast(e.error==='not-allowed'?'Permita o acesso ao microfone nas configurações do navegador.':e.error==='no-speech'?'Não detectei fala. Tente novamente.':'Não consegui reconhecer. Tente novamente.');render()};recognition.onend=()=>{const b=$('#micBtn');if(b){b.disabled=false;b.textContent='🎙️ Tentar novamente'}};recognition.start()}catch(e){toast('Não foi possível iniciar o microfone. Verifique a permissão.')}}
function stringSimilarity(a,b){if(a===b)return 1;if(!a||!b)return 0;const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return 1-prev[n]/Math.max(m,n)}
function renderAdventureFeedback(){const el=$('#pronunciation-feedback');if(el&&adventureResult)el.innerHTML=adventureResult.html;const b=$('#micBtn');if(b){b.disabled=false;b.textContent='🎙️ Tentar novamente'}}
function nextAdventure(){if(recognition){try{recognition.abort()}catch{}}adventureCard=null;adventureResult=null;render()}
function settingsPage(){return head('DO SEU JEITINHO','No seu ritmo','Seu aplicativo, suas regras.')+`<div class="card"><div class="settings-row"><div><p><b>Novos cartões por dia</b></p><small>Quantidade máxima na sessão diária.</small></div><input id="daily" class="field" type="number" min="1" max="50" value="${Number(S.settings.daily)||10}" style="max-width:90px;margin:0"></div><div class="settings-row"><div><p><b>Voz em inglês</b></p><small>Os áudios do projeto são usados automaticamente em inglês e português; esta opção controla apenas a voz alternativa do navegador para inglês.</small></div><select id="voice" class="field" style="max-width:260px;margin:0"><option>Carregando vozes…</option></select></div><div class="settings-row"><div><p><b>Velocidade da voz</b></p><small>Ritmo da pronúncia em inglês.</small></div><input id="rate" type="range" min="0.65" max="1.15" step="0.05" value="${S.settings.voiceRate}" style="max-width:130px"></div><div class="settings-row"><div><p><b>Reproduzir áudio automaticamente</b></p><small>Nos exercícios de listening.</small></div><input id="auto" type="checkbox" ${S.settings.autoSpeak?'checked':''}></div><div class="settings-row"><div><p><b>Sino de conquista</b></p><small>Um sino indiano suave de duas notas ao acertar.</small></div><input id="success-sound" type="checkbox" ${S.settings.successSound!==false?'checked':''}></div><div class="settings-row"><div><p><b>Animação de lótus</b></p><small>Flor dourada, brilhos e pétalas ao conquistar.</small></div><input id="success-animation" type="checkbox" ${S.settings.successAnimation!==false?'checked':''}></div><button class="btn" onclick="saveSettings()">Salvar preferências</button></div><div class="section-head"><h2>Seus dados</h2></div><div class="card"><p class="muted">Seu vocabulário e progresso ficam neste navegador. Faça backups de tempos em tempos para não perder nada.</p><div class="toolbar"><button class="btn" onclick="exportBackup()">💾 Exportar backup</button><label class="btn secondary" style="cursor:pointer">Restaurar backup<input type="file" accept="application/json,.json" hidden onchange="importBackup(this)"></label></div><button class="btn secondary" onclick="exportCSV()">📄 Exportar vocabulário CSV</button><p class="muted" style="font-size:12px;margin-bottom:0">Compatível com o backup do aplicativo anterior (ingles-v1).</p></div><div class="section-head"><h2>Sobre o Meu Inglês</h2></div><div class="card"><p><b>Meu Inglês ✨</b></p><p class="muted">Uma ferramenta pessoal de aprendizagem, com armazenamento local, cartões personalizados, aventura de pronúncia, conversação adaptativa, áudios premium locais (quando instalados), vozes do dispositivo como alternativa e revisão espaçada.</p><button class="btn soft" onclick="speak('Hello! Let us learn English together.')">🔊 Testar pronúncia</button></div>`}
function saveSettings(){const previous={...S.settings};S.settings.daily=Math.max(1,Math.min(50,Number($('#daily').value)||10));S.settings.voiceRate=Number($('#rate').value)||.88;S.settings.autoSpeak=$('#auto').checked;S.settings.successSound=$('#success-sound')?.checked!==false;S.settings.successAnimation=$('#success-animation')?.checked!==false;S.settings.voiceName=$('#voice')?.value||'';if(!save()){S.settings=previous;return}toast('Preferências salvas! ✨');render()}
function exportBackup(){const blob=new Blob([JSON.stringify({...S,exportedAt:new Date().toISOString(),appVersion:2},null,2)],{type:'application/json'});download(blob,`meu-ingles-backup-${today()}.json`);toast('Backup preparado! 💾')}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const previous=S;try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.cards)||!d.cards.every(c=>c&&typeof c.en==='string'&&typeof c.pt==='string'))throw Error('invalid');if(!confirm(`O backup contém ${d.cards.length} cartões. Substituir os dados atuais? Faça um backup antes, se quiser guardar os dois.`))return;const candidate=stateFromData(d);S=candidate;if(!save()){S=previous;return}toast('Backup restaurado e salvo com sucesso! 💜');page='home';session=null;render()}catch{S=previous;toast('Arquivo inválido ou incompatível. Seus dados atuais foram preservados.')}finally{input.value=''}};r.onerror=()=>{input.value='';toast('Não foi possível ler o arquivo de backup. Seus dados atuais foram preservados.')};r.readAsText(f)}
function exportCSV(){const rows=[['Inglês','Português','Exemplo','Categoria'],...S.cards.map(c=>[c.en,c.pt,c.ex,c.category||'Geral'])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'meu-vocabulario.csv')}
